services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      GUILD_ID: ${GUILD_ID:?}
      REPORT_CHANNEL_ID: ${REPORT_CHANNEL_ID:-}
      INACTIVE_DAYS: ${INACTIVE_DAYS:-7}
      TZ: ${TZ:-America/Sao_Paulo}
      DATA_DIR: /data
    volumes:
      - bot-data:/data
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  bot-data:
