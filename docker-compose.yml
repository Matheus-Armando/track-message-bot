services:
  bot:
    build: .
    image: track-message-bot
    container_name: track-message-bot
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
